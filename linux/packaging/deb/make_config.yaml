display_name: FastCat
package_name: fastcat
maintainer:
  name: chen08209
  email: chen08209@gmail.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-dev
  - libkeybinder-3.0-dev
  - libwebkit2gtk-4.1-0
  - fonts-noto-cjk

keywords:
  - 快猫
  - FastCat
  - Clash
  - ClashMeta
  - Proxy

generic_name: FastCat

categories:
  - Network

startup_notify: true
startup_wm_class: com.fastcat.app

postinstall_scripts:
  - for name in 'fastcat' 'FastCat' '快猫' 'fl_clash' 'fastcatCore'; do if command -v pkill >/dev/null 2>&1; then pkill -TERM -x "$name" >/dev/null 2>&1 || true; elif command -v killall >/dev/null 2>&1; then killall -TERM "$name" >/dev/null 2>&1 || true; fi; done
  - sleep 1
  - for name in 'fastcat' 'FastCat' '快猫' 'fl_clash' 'fastcatCore'; do if command -v pkill >/dev/null 2>&1; then pkill -KILL -x "$name" >/dev/null 2>&1 || true; elif command -v killall >/dev/null 2>&1; then killall -KILL "$name" >/dev/null 2>&1 || true; fi; done
  - printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=FastCat' 'Name[zh]=快猫' 'Name[zh_CN]=快猫' 'Name[zh_TW]=快猫' 'Name[zh_HK]=快猫' 'Name[zh_MO]=快猫' 'Name[zh_SG]=快猫' 'GenericName=FastCat' 'Icon=/usr/share/icons/hicolor/256x256/apps/FastCat.png' 'Exec=FastCat %U' 'Categories=Network;' 'Keywords=快猫;FastCat;Clash;ClashMeta;Proxy;' 'StartupNotify=true' 'StartupWMClass=com.fastcat.app' > /usr/share/applications/com.fastcat.app.desktop
  - chmod 644 /usr/share/applications/com.fastcat.app.desktop
  - rm -f /usr/share/applications/FastCat.desktop /usr/share/applications/fastcat.desktop
  - command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
postuninstall_scripts:
  - rm -f /usr/share/applications/com.fastcat.app.desktop /usr/share/applications/FastCat.desktop /usr/share/applications/fastcat.desktop
