include: package:flutter_lints/recommended.yaml

linter:
  rules:
    # Keep the analyze gate focused on correctness. The existing codebase has
    # many historical style-only lints, so leave those to formatter/refactor
    # passes instead of failing full-repo analysis.
    avoid_print: false
    avoid_unnecessary_containers: false
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    prefer_final_locals: false
    prefer_single_quotes: false
    sized_box_for_whitespace: false
    sort_child_properties_last: false
    unnecessary_late: false
    use_key_in_widget_constructors: false
    use_super_parameters: false

analyzer:
  errors:
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
    - "lib/l10n/intl/**"
    - "lib/sdk/**"
