<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Gateway · Admin</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
<div id="auth">
  <h1>Device Gateway</h1>
  <p>请输入 Admin Token</p>
  <form id="auth-form">
    <input type="password" id="token-input" placeholder="X-Admin-Token" autofocus>
    <button type="submit">进入</button>
  </form>
  <p id="auth-error"></p>
</div>

<div id="app" style="display:none">
  <nav>
    <span class="brand">Device Gateway</span>
    <a href="#dashboard" class="nav-link active" data-tab="dashboard">仪表盘</a>
    <a href="#users" class="nav-link" data-tab="users">用户管理</a>
    <a href="#audit" class="nav-link" data-tab="audit">审计日志</a>
    <button id="logout-btn">退出</button>
  </nav>

  <section id="tab-dashboard" class="tab-content active">
    <div class="stats"></div>
    <div id="dashboard-details" class="details-panel" style="display:none"></div>
    <div class="dashboard-grid">
      <section class="metric-panel">
        <div class="metric-title">在线设备活跃</div>
        <div id="activity-panel" class="metric-list"></div>
      </section>
      <section class="metric-panel">
        <div class="metric-title">设备地区分布</div>
        <div id="region-panel" class="metric-list"></div>
      </section>
      <section class="metric-panel">
        <div class="metric-title">运营商统计</div>
        <div id="isp-panel" class="metric-list"></div>
      </section>
      <section class="metric-panel">
        <div class="metric-title">版本号分布</div>
        <div id="version-panel" class="metric-list"></div>
      </section>
    </div>
  </section>

  <section id="tab-users" class="tab-content">
    <div class="toolbar">
      <input type="search" id="user-search" placeholder="搜索邮箱或用户 ID...">
      <select id="user-device-status">
        <option value="all">全部设备状态</option>
        <option value="active">有活跃设备</option>
        <option value="inactive">无活跃设备</option>
      </select>
      <select id="user-limit-mode">
        <option value="all">全部上限</option>
        <option value="overridden">已覆盖上限</option>
        <option value="default">默认上限</option>
      </select>
      <select id="user-sort">
        <option value="updated_at">按更新时间</option>
        <option value="last_synced_at">按最后同步</option>
        <option value="created_at">按创建时间</option>
        <option value="email">按邮箱</option>
        <option value="plan_name">按套餐</option>
        <option value="active_device_count">按活跃设备</option>
        <option value="effective_device_limit">按有效上限</option>
      </select>
      <select id="user-order">
        <option value="desc">降序</option>
        <option value="asc">升序</option>
      </select>
    </div>
    <table id="users-table">
      <thead>
        <tr>
          <th>邮箱</th>
          <th>套餐</th>
          <th>设备</th>
          <th>上限</th>
          <th>最后同步</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="users-pagination" class="pagination"></div>
  </section>

  <section id="tab-audit" class="tab-content">
    <table id="audit-table">
      <thead>
        <tr>
          <th>时间</th>
          <th>操作</th>
          <th>用户</th>
          <th>设备</th>
          <th>IP</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="audit-pagination" class="pagination"></div>
  </section>
  <button id="back-to-top" title="回到顶部">↑</button>
</div>

<script src="/admin/static/admin.js"></script>
</body>
</html>
