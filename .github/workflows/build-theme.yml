name: Build Catboard Theme

on:
  workflow_dispatch:
  push:
    paths:
      - 'theme/**'
      - '.github/workflows/build-theme.yml'

permissions:
  contents: read

jobs:
  theme:
    name: Build FastCat theme package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme/source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: theme/source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build importable Catboard theme
        run: npm run build:theme

      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: fastcat-catboard-theme
          path: theme/fastcat-catboard-theme-*.zip
          if-no-files-found: error
          retention-days: 14
