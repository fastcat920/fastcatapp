name: Build Client

env:
  FLUTTER_VERSION: "3.44.7"
  FASTCAT_KEY_CURRENT_ID: ${{ vars.FASTCAT_KEY_CURRENT_ID }}
  FASTCAT_KEY_NEXT_ID: ${{ vars.FASTCAT_KEY_NEXT_ID }}
  FASTCAT_SUBSCRIPTION_FLAG: ${{ vars.FASTCAT_SUBSCRIPTION_FLAG }}
  FASTCAT_REQUIRE_ENCRYPTION: ${{ vars.FASTCAT_REQUIRE_ENCRYPTION }}

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build Android APK
        type: boolean
        default: true
      build_windows:
        description: Build Windows amd64 client
        type: boolean
        default: false
      build_windows_arm64:
        description: Build experimental Windows arm64 client
        type: boolean
        default: false
      build_windows_universal:
        description: Build single Windows installer with x64 and arm64 payloads
        type: boolean
        default: true
      build_ios:
        description: Build iOS IPA
        type: boolean
        default: true
      build_linux:
        description: Build Linux amd64 and arm64 packages
        type: boolean
        default: true
      build_macos:
        description: Build universal macOS DMG
        type: boolean
        default: true
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.build_android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h /

          # Ubuntu runners include large SDKs that are not used by the Android
          # build. Remove them before Flutter/Gradle and the native cores create
          # their build caches. The required Android NDK is installed below.
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk

          sudo apt-get clean
          docker system prune --all --force || true

          echo "Disk space after cleanup:"
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
          cache-dependency-path: core/go.sum

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build cache
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Setup Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            cat > android/local.properties << PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "✓ Release keystore configured"
          else
            echo "i KEYSTORE_BASE64 not set, will use debug keystore (signature will vary per build)"
          fi

      - name: Build Android native core
        run: |
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.0.13004108"
          dart run setup.dart android --arch arm --out core
          dart run setup.dart android --arch arm64 --out core

          for abi in armeabi-v7a arm64-v8a; do
            core="libclash/android/$abi/libclash.so"
            test -s "$core"
            grep -a -q "main.handleStreamingProbe" "$core" || {
              echo "Android core for $abi does not contain streamingProbe"
              exit 1
            }
          done

      - name: Build APK
        env:
          XOR_KEY: ${{ secrets.XOR_KEY }}
          FASTCAT_KEY_CURRENT: ${{ secrets.FASTCAT_KEY_CURRENT }}
          FASTCAT_KEY_NEXT: ${{ secrets.FASTCAT_KEY_NEXT }}
        run: bash scripts/package_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows amd64
    runs-on: windows-2022
    if: github.event_name == 'push' || inputs.build_windows || inputs.build_windows_universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Verify Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            Write-Host "Inno Setup found at: $(Get-Command iscc | Select-Object -ExpandProperty Source)"
          } else {
            Write-Host "WARNING: iscc.exe not on PATH"
            Get-ChildItem "C:\Program Files*\Inno Setup*\iscc.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          }

      - name: Link Inno Setup to expected path
        shell: pwsh
        run: |
          $innoDirs = Get-ChildItem "C:\Program Files\Inno Setup*" -Directory -ErrorAction SilentlyContinue
          if ($innoDirs) {
            $target = $innoDirs[0].FullName
            $link = "C:\Program Files (x86)\Inno Setup 6"
            if (-not (Test-Path $link)) {
              New-Item -ItemType Junction -Path $link -Target $target -Force | Out-Null
              Write-Host "Junction created: $link -> $target"
            } else {
              Write-Host "Junction already exists: $link"
            }
            "INNO_SETUP_HOME=$target" >> $env:GITHUB_ENV
          } else {
            Write-Host "No Inno Setup directory found under C:\Program Files"
          }

      - name: Install VS 2019 C++ Build Tools
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[16.0,17.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if ($vsPath) {
            Write-Host "VS 2019 C++ tools already installed at $vsPath"
            exit 0
          }
          Write-Host "Downloading VS 2019 Build Tools installer..."
          $installer = "$env:TEMP\vs_buildtools_2019.exe"
          & ".\.github\scripts\download-file.ps1" `
            -Uri "https://aka.ms/vs/16/release/vs_buildtools.exe" `
            -OutFile $installer
          Write-Host "Installing VS 2019 Build Tools (C++ workload only, this takes ~4 min)..."
          Start-Process -FilePath $installer -ArgumentList "--quiet --wait --norestart --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" -NoNewWindow -Wait
          Write-Host "VS 2019 Build Tools installed"

      - name: Bundle VC++ Redist
        shell: pwsh
        run: |
          # --- 1. 下载 vc_redist.x64.exe (供 Inno Setup 安装时运行) ---
          Write-Host "Downloading VC++ Redist x64..."
          & ".\.github\scripts\download-file.ps1" `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "vc_redist.x64.exe"
          Write-Host "vc_redist.x64.exe downloaded ($((Get-Item vc_redist.x64.exe).Length) bytes)"

          # --- 2. 从已安装的 VS Build Tools 提取 DLL 到 windows/vc_redist/ (CMake 兜底打包) ---
          Write-Host "Copying VC++ runtime DLLs from VS installation..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) {
            Write-Host "WARNING: vswhere returned no VS path, trying fallback dirs..."
            $fallback = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\BuildTools\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\*.dll" -Recurse -ErrorAction SilentlyContinue | Select -First 3
            if ($fallback) {
              New-Item -Force -ItemType Directory windows\vc_redist | Out-Null
              Copy-Item $fallback windows\vc_redist\ -Force
              Write-Host "DLLs copied via fallback"
            }
          } else {
            $dllDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT" -Directory | Sort-Object -Descending | Select -First 1
            if ($dllDir) {
              New-Item -Force -ItemType Directory windows\vc_redist | Out-Null
              Copy-Item "$($dllDir.FullName)\msvcp140.dll" windows\vc_redist\ -Force -ErrorAction SilentlyContinue
              Copy-Item "$($dllDir.FullName)\vcruntime140.dll" windows\vc_redist\ -Force -ErrorAction SilentlyContinue
              Copy-Item "$($dllDir.FullName)\vcruntime140_1.dll" windows\vc_redist\ -Force -ErrorAction SilentlyContinue
              Write-Host "DLLs copied from $($dllDir.FullName)"
            } else {
              Write-Host "WARNING: CRT DLL directory not found under $vsPath"
            }
          }
          Write-Host "=== windows/vc_redist/ contents ==="
          if (Test-Path windows\vc_redist) { Get-ChildItem windows\vc_redist } else { Write-Host "(empty)" }

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build cache
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Build Windows client
        shell: pwsh
        env:
          XOR_KEY: ${{ secrets.XOR_KEY }}
          FASTCAT_KEY_CURRENT: ${{ secrets.FASTCAT_KEY_CURRENT }}
          FASTCAT_KEY_NEXT: ${{ secrets.FASTCAT_KEY_NEXT }}
        run: dart run setup.dart windows --arch amd64 --out app --env stable

      - name: Build Windows exe installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Get-Command iscc | Select-Object -ExpandProperty Source
          Write-Host "iscc: $iscc"

          $buildOut = (Resolve-Path "build\windows\x64\runner\Release").Path
          if (-not (Test-Path $buildOut)) { throw "Flutter build not found: $buildOut" }

          # Parse make_config.yaml (strip quotes from YAML values)
          $cfg = Get-Content "windows\packaging\exe\make_config.yaml" -Raw
          function yv($k) {
            if ($cfg -match "(?m)^${k}:\s*(.+)$") {
              $v = $matches[1].Trim()
              # Strip surrounding quotes if present (YAML-quoted values)
              if ($v -match '^"(.*)"$' -or $v -match "^'(.*)'$") { $v = $matches[1] }
              return $v
            }
            return ""
          }
          $display = yv "display_name"; if (-not $display) { $display = yv "app_name" }; Write-Host "DISPLAY_NAME resolved to: $display"
          $exe    = yv "executable_name"; if (-not $exe) { $exe = "FastCat.exe" }
          $pub    = yv "publisher"
          $pubUrl = yv "publisher_url"
          $icon   = yv "setup_icon_file"
          $appId  = yv "app_id"; if (-not $appId) { $appId = "{" + [guid]::NewGuid() + "}" }

          $ver = "1.0.0"
          $ps = Get-Content "pubspec.yaml" -Raw
          if ($ps -match "(?m)^version:\s*(.+)$") { $ver = ($matches[1] -split '\+')[0].Trim() }
          $out = "$([IO.Path]::GetFileNameWithoutExtension($exe))-Windows-$ver-x64.exe"

          # Render ISS template
          $iss = (Get-Content "windows\packaging\exe\inno_setup.iss" -Raw) `
            -replace '\{\{APP_ID\}\}', $appId `
            -replace '\{\{APP_VERSION\}\}', $ver `
            -replace '\{\{DISPLAY_NAME\}\}', $display `
            -replace '\{\{PUBLISHER_NAME\}\}', $pub `
            -replace '\{\{PUBLISHER_URL\}\}', $pubUrl `
            -replace '\{\{OUTPUT_BASE_FILENAME\}\}', ([IO.Path]::GetFileNameWithoutExtension($out)) `
            -replace '\{\{EXECUTABLE_NAME\}\}', ([IO.Path]::GetFileName($exe)) `
            -replace '\{\{INSTALL_DIR_NAME\}\}', ([IO.Path]::GetFileNameWithoutExtension($exe)) `
            -replace '\{\{SETUP_ICON_FILE\}\}', $icon `
            -replace '\{\{SOURCE_DIR\}\}', $buildOut `
            -replace '\{\{PRIVILEGES_REQUIRED\}\}', "admin" `
            -replace '\{\{ARCH\}\}', "x64compatible" `
            -replace '\{\{CREATE_DESKTOP_ICON\}\}', "true"

          # Replace locale template loop with en+zh
          $nl = [Environment]::NewLine
          $locales = 'Name: "english"; MessagesFile: "compiler:Default.isl"' + $nl +
                     'Name: "chineseSimplified"; MessagesFile: "..\\windows\\packaging\\exe\\ChineseSimplified.isl"'
          $iss = $iss -replace '(?s)\{% for locale in LOCALES %\}.*?\{% endfor %\}', $locales
          # Replace CREATE_DESKTOP_ICON conditional with checkedonce
          $iss = $iss -replace '\{% if CREATE_DESKTOP_ICON != true %\}unchecked\{% else %\}checkedonce\{% endif %\}', 'checkedonce'
          # Replace PRIVILEGES_REQUIRED conditional with runascurrentuser
          $iss = $iss -replace '\{% if PRIVILEGES_REQUIRED == .admin. %\}runascurrentuser\{% endif %\}', 'runascurrentuser'
          # Clean up any remaining template tags
          $iss = $iss -replace '\{%[^%]*%\}', ''
          $iss = $iss -replace '\{\{[^}]*\}\}', ''

          $issFile = "build\setup.iss"
          New-Item -Force -ItemType Directory (Split-Path $issFile) | Out-Null
          [IO.File]::WriteAllText((Resolve-Path ".").Path + "\" + $issFile, $iss)
          Write-Host "ISS written to $issFile"
          Copy-Item vc_redist.x64.exe build\ -Force

          & $iscc $issFile
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }

          # Find and copy exe
          $exeFile = Join-Path (Split-Path $issFile -Parent) "$out"
          if (-not (Test-Path $exeFile)) {
            $exeFile = Join-Path (Get-Location) "$out"
          }
          if (-not (Test-Path $exeFile)) {
            $found = Get-ChildItem -Recurse -Filter "$out" -ErrorAction SilentlyContinue | Select -First 1
            if ($found) { $exeFile = $found.FullName }
          }
          if (Test-Path $exeFile) {
            New-Item -Force -ItemType Directory dist | Out-Null
            Copy-Item $exeFile dist\ -Force
            Write-Host "Exe copied to dist/"
          } else {
            Write-Host "WARNING: exe not found, searching..."
            Get-ChildItem -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Select FullName, Length | ft -AutoSize
            throw "Exe file not produced"
          }

      - name: List dist contents
        shell: pwsh
        if: always()
        run: |
          Write-Host "=== dist/ ==="
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select FullName, Length }
          else { Write-Host "dist/ absent" }
          Write-Host "=== all .exe .zip ==="
          Get-ChildItem . -Recurse -Include *.zip,*.exe -ErrorAction SilentlyContinue | Select FullName, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-windows-amd64
          path: dist/**
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows amd64 payload
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_windows_universal
        with:
          name: FastCat-windows-amd64-payload
          path: build/windows/x64/runner/Release/**
          retention-days: 3
          if-no-files-found: error

  windows_arm64:
    name: Windows arm64
    runs-on: windows-11-arm
    if: github.event_name == 'workflow_dispatch' && (inputs.build_windows_arm64 || inputs.build_windows_universal)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $flutterRoot = Join-Path $env:RUNNER_TEMP "flutter-arm64"
          git clone --filter=blob:none --depth 1 --branch $env:FLUTTER_VERSION `
            https://github.com/flutter/flutter.git $flutterRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Flutter $env:FLUTTER_VERSION"
          }
          $flutterBin = Join-Path $flutterRoot "bin"
          $flutter = Join-Path $flutterBin "flutter.bat"
          $flutterBin >> $env:GITHUB_PATH
          "FLUTTER_ROOT=$flutterRoot" >> $env:GITHUB_ENV
          & $flutter config --no-analytics --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw "Flutter configuration failed" }
          & $flutter precache --windows
          if ($LASTEXITCODE -ne 0) { throw "Flutter Windows precache failed" }
          & $flutter --version
          if ($LASTEXITCODE -ne 0) { throw "Flutter version check failed" }

      - name: Verify Flutter Windows ARM64 host
        shell: pwsh
        run: |
          $windowsDevice = flutter devices --machine |
            ConvertFrom-Json |
            Where-Object { $_.id -eq "windows" }
          if (-not $windowsDevice) {
            throw "Flutter did not detect the Windows desktop target"
          }
          Write-Host "Flutter Windows target: $($windowsDevice.targetPlatform)"
          if ($windowsDevice.targetPlatform -ne "windows-arm64") {
            throw "Expected windows-arm64, got $($windowsDevice.targetPlatform)"
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Link Inno Setup to expected path
        shell: pwsh
        run: |
          $innoDirs = Get-ChildItem "C:\Program Files\Inno Setup*" -Directory -ErrorAction SilentlyContinue
          if ($innoDirs) {
            $target = $innoDirs[0].FullName
            $link = "C:\Program Files (x86)\Inno Setup 6"
            if (-not (Test-Path $link)) {
              New-Item -ItemType Junction -Path $link -Target $target -Force | Out-Null
              Write-Host "Junction created: $link -> $target"
            } else {
              Write-Host "Junction already exists: $link"
            }
            "INNO_SETUP_HOME=$target" >> $env:GITHUB_ENV
          } else {
            Write-Host "No Inno Setup directory found under C:\Program Files"
          }

      - name: Bundle VC++ Redist arm64
        shell: pwsh
        run: |
          Write-Host "Downloading VC++ Redist arm64..."
          & ".\.github\scripts\download-file.ps1" `
            -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" `
            -OutFile "vc_redist.x64.exe"
          Write-Host "vc_redist arm64 downloaded as vc_redist.x64.exe for the shared installer template"

          Write-Host "Copying ARM64 VC++ runtime DLLs from VS installation..."
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath 2>$null
          if (-not $vsPath) {
            Write-Host "WARNING: vswhere returned no ARM64 VS path, trying fallback dirs..."
            $fallback = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\arm64\Microsoft.VC143.CRT\*.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3
            if ($fallback) {
              New-Item -Force -ItemType Directory windows\vc_redist | Out-Null
              Copy-Item $fallback windows\vc_redist\ -Force
              Write-Host "DLLs copied via fallback"
            }
          } else {
            $dllDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\arm64\Microsoft.VC143.CRT" -Directory | Sort-Object -Descending | Select-Object -First 1
            if ($dllDir) {
              New-Item -Force -ItemType Directory windows\vc_redist | Out-Null
              Copy-Item "$($dllDir.FullName)\msvcp140.dll" windows\vc_redist\ -Force -ErrorAction SilentlyContinue
              Copy-Item "$($dllDir.FullName)\vcruntime140.dll" windows\vc_redist\ -Force -ErrorAction SilentlyContinue
              Copy-Item "$($dllDir.FullName)\vcruntime140_1.dll" windows\vc_redist\ -Force -ErrorAction SilentlyContinue
              Write-Host "DLLs copied from $($dllDir.FullName)"
            } else {
              Write-Host "WARNING: ARM64 CRT DLL directory not found under $vsPath"
            }
          }
          Write-Host "=== windows/vc_redist/ contents ==="
          if (Test-Path windows\vc_redist) { Get-ChildItem windows\vc_redist } else { Write-Host "(empty)" }

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build cache
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Build Windows arm64 client
        shell: pwsh
        env:
          XOR_KEY: ${{ secrets.XOR_KEY }}
          FASTCAT_KEY_CURRENT: ${{ secrets.FASTCAT_KEY_CURRENT }}
          FASTCAT_KEY_NEXT: ${{ secrets.FASTCAT_KEY_NEXT }}
        run: dart run setup.dart windows --arch arm64 --out app --env stable

      - name: Verify ARM64 binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Get-PeMachine($Path) {
            $bytes = [IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          $expected = 0xaa64
          $cfg = Get-Content "windows\packaging\exe\make_config.yaml" -Raw
          $exe = "FastCat.exe"
          if ($cfg -match "(?m)^executable_name:\s*(.+)$") {
            $exe = $matches[1].Trim().Trim('"').Trim("'")
          }

          $paths = @(
            "build\windows\arm64\runner\Release\$exe",
            "build\windows\arm64\runner\Release\flutter_windows.dll",
            "build\windows\arm64\runner\Release\fastcatCore.exe",
            "build\windows\arm64\runner\Release\fastcatHelperService.exe"
          )

          foreach ($path in $paths) {
            if (-not (Test-Path $path)) { throw "Missing ARM64 artifact: $path" }
            $machine = Get-PeMachine $path
            Write-Host "$path machine=0x$($machine.ToString('x4'))"
            if ($machine -ne $expected) {
              throw "$path is not ARM64 (expected 0xaa64)"
            }
          }

      - name: Build Windows arm64 exe installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Get-Command iscc | Select-Object -ExpandProperty Source
          Write-Host "iscc: $iscc"

          $buildOut = (Resolve-Path "build\windows\arm64\runner\Release").Path
          if (-not (Test-Path $buildOut)) { throw "Flutter ARM64 build not found: $buildOut" }

          $cfg = Get-Content "windows\packaging\exe\make_config.yaml" -Raw
          function yv($k) {
            if ($cfg -match "(?m)^${k}:\s*(.+)$") {
              $v = $matches[1].Trim()
              if ($v -match '^"(.*)"$' -or $v -match "^'(.*)'$") { $v = $matches[1] }
              return $v
            }
            return ""
          }
          $display = yv "display_name"; if (-not $display) { $display = yv "app_name" }; Write-Host "DISPLAY_NAME resolved to: $display"
          $exe    = yv "executable_name"; if (-not $exe) { $exe = "FastCat.exe" }
          $pub    = yv "publisher"
          $pubUrl = yv "publisher_url"
          $icon   = yv "setup_icon_file"
          $appId  = yv "app_id"; if (-not $appId) { $appId = "{" + [guid]::NewGuid() + "}" }

          $ver = "1.0.0"
          $ps = Get-Content "pubspec.yaml" -Raw
          if ($ps -match "(?m)^version:\s*(.+)$") { $ver = ($matches[1] -split '\+')[0].Trim() }
          $out = "$([IO.Path]::GetFileNameWithoutExtension($exe))-Windows-$ver-arm64.exe"

          $iss = (Get-Content "windows\packaging\exe\inno_setup.iss" -Raw) `
            -replace '\{\{APP_ID\}\}', $appId `
            -replace '\{\{APP_VERSION\}\}', $ver `
            -replace '\{\{DISPLAY_NAME\}\}', $display `
            -replace '\{\{PUBLISHER_NAME\}\}', $pub `
            -replace '\{\{PUBLISHER_URL\}\}', $pubUrl `
            -replace '\{\{OUTPUT_BASE_FILENAME\}\}', ([IO.Path]::GetFileNameWithoutExtension($out)) `
            -replace '\{\{EXECUTABLE_NAME\}\}', ([IO.Path]::GetFileName($exe)) `
            -replace '\{\{INSTALL_DIR_NAME\}\}', ([IO.Path]::GetFileNameWithoutExtension($exe)) `
            -replace '\{\{SETUP_ICON_FILE\}\}', $icon `
            -replace '\{\{SOURCE_DIR\}\}', $buildOut `
            -replace '\{\{PRIVILEGES_REQUIRED\}\}', "admin" `
            -replace '\{\{ARCH\}\}', "arm64" `
            -replace '\{\{CREATE_DESKTOP_ICON\}\}', "true"

          $nl = [Environment]::NewLine
          $locales = 'Name: "english"; MessagesFile: "compiler:Default.isl"' + $nl +
                     'Name: "chineseSimplified"; MessagesFile: "..\\windows\\packaging\\exe\\ChineseSimplified.isl"'
          $iss = $iss -replace '(?s)\{% for locale in LOCALES %\}.*?\{% endfor %\}', $locales
          $iss = $iss -replace '\{% if CREATE_DESKTOP_ICON != true %\}unchecked\{% else %\}checkedonce\{% endif %\}', 'checkedonce'
          $iss = $iss -replace '\{% if PRIVILEGES_REQUIRED == .admin. %\}runascurrentuser\{% endif %\}', 'runascurrentuser'
          $iss = $iss -replace '\{%[^%]*%\}', ''
          $iss = $iss -replace '\{\{[^}]*\}\}', ''

          $issFile = "build\setup-arm64.iss"
          New-Item -Force -ItemType Directory (Split-Path $issFile) | Out-Null
          [IO.File]::WriteAllText((Resolve-Path ".").Path + "\" + $issFile, $iss)
          Write-Host "ISS written to $issFile"
          Copy-Item vc_redist.x64.exe build\ -Force

          & $iscc $issFile
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }

          $exeFile = Join-Path (Split-Path $issFile -Parent) "$out"
          if (-not (Test-Path $exeFile)) {
            $exeFile = Join-Path (Get-Location) "$out"
          }
          if (-not (Test-Path $exeFile)) {
            $found = Get-ChildItem -Recurse -Filter "$out" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $exeFile = $found.FullName }
          }
          if (Test-Path $exeFile) {
            New-Item -Force -ItemType Directory dist | Out-Null
            Copy-Item $exeFile dist\ -Force
            Write-Host "ARM64 exe copied to dist/"
          } else {
            Write-Host "WARNING: ARM64 exe not found, searching..."
            Get-ChildItem -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
            throw "ARM64 exe file not produced"
          }

      - name: List dist contents
        shell: pwsh
        if: always()
        run: |
          Write-Host "=== dist/ ==="
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select-Object FullName, Length }
          else { Write-Host "dist/ absent" }
          Write-Host "=== ARM64 release dir ==="
          if (Test-Path "build\windows\arm64\runner\Release") {
            Get-ChildItem "build\windows\arm64\runner\Release" | Select-Object FullName, Length
          }

      - name: Upload Windows arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-windows-arm64
          path: dist/**
          if-no-files-found: error
          retention-days: 3

      - name: Upload Windows arm64 payload
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.build_windows_universal
        with:
          name: FastCat-windows-arm64-payload
          path: build/windows/arm64/runner/Release/**
          retention-days: 3
          if-no-files-found: error

  windows_universal:
    name: Windows universal installer
    runs-on: windows-2022
    needs: [windows, windows_arm64]
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download Windows amd64 payload
        uses: actions/download-artifact@v4
        with:
          name: FastCat-windows-amd64-payload
          path: build/universal/x64

      - name: Download Windows arm64 payload
        uses: actions/download-artifact@v4
        with:
          name: FastCat-windows-arm64-payload
          path: build/universal/arm64

      - name: Bundle VC++ Redists
        shell: pwsh
        run: |
          & ".\.github\scripts\download-file.ps1" `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "vc_redist.x64.exe"
          & ".\.github\scripts\download-file.ps1" `
            -Uri "https://aka.ms/vs/17/release/vc_redist.arm64.exe" `
            -OutFile "vc_redist.arm64.exe"

      - name: Build Windows universal exe installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = Get-Command iscc | Select-Object -ExpandProperty Source
          Write-Host "iscc: $iscc"

          $x64Source = (Resolve-Path "build\universal\x64").Path
          $arm64Source = (Resolve-Path "build\universal\arm64").Path
          $brandCfg = Get-Content "assets\config\config.yaml" -Raw
          $appName = "快猫"
          $appNameEn = "FastCat"
          if ($brandCfg -match "(?m)^app_name:\s*(.+)$") {
            $appName = $matches[1].Trim().Trim('"').Trim("'")
          }
          if ($brandCfg -match "(?m)^app_name_en:\s*(.+)$") {
            $appNameEn = $matches[1].Trim().Trim('"').Trim("'")
          }
          $exe = "$appNameEn.exe"
          if (-not (Test-Path (Join-Path $x64Source $exe))) { throw "Missing x64 payload $exe" }
          if (-not (Test-Path (Join-Path $arm64Source $exe))) { throw "Missing arm64 payload $exe" }

          $cfg = Get-Content "windows\packaging\exe\make_config.yaml" -Raw
          function yv($k) {
            if ($cfg -match "(?m)^${k}:\s*(.+)$") {
              $v = $matches[1].Trim()
              if ($v -match '^"(.*)"$' -or $v -match "^'(.*)'$") { $v = $matches[1] }
              return $v
            }
            return ""
          }
          $ver = "1.0.0"
          $ps = Get-Content "pubspec.yaml" -Raw
          if ($ps -match "(?m)^version:\s*(.+)$") { $ver = ($matches[1] -split '\+')[0].Trim() }
          $display = $appName
          $out = "$appNameEn-Windows-$ver.exe"
          $pub    = yv "publisher"
          $pubUrl = yv "publisher_url"
          $icon   = yv "setup_icon_file"
          $appId  = yv "app_id"; if (-not $appId) { $appId = "{" + [guid]::NewGuid() + "}" }

          $iss = (Get-Content "windows\packaging\exe\inno_setup_dual_payload.iss" -Raw) `
            -replace '\{\{APP_ID\}\}', $appId `
            -replace '\{\{APP_VERSION\}\}', $ver `
            -replace '\{\{DISPLAY_NAME\}\}', $display `
            -replace '\{\{PUBLISHER_NAME\}\}', $pub `
            -replace '\{\{PUBLISHER_URL\}\}', $pubUrl `
            -replace '\{\{OUTPUT_BASE_FILENAME\}\}', ([IO.Path]::GetFileNameWithoutExtension($out)) `
            -replace '\{\{EXECUTABLE_NAME\}\}', ([IO.Path]::GetFileName($exe)) `
            -replace '\{\{INSTALL_DIR_NAME\}\}', ([IO.Path]::GetFileNameWithoutExtension($exe)) `
            -replace '\{\{SETUP_ICON_FILE\}\}', $icon `
            -replace '\{\{X64_SOURCE_DIR\}\}', $x64Source `
            -replace '\{\{ARM64_SOURCE_DIR\}\}', $arm64Source `
            -replace '\{\{PRIVILEGES_REQUIRED\}\}', "admin"

          $issFile = "build\setup-universal.iss"
          New-Item -Force -ItemType Directory (Split-Path $issFile) | Out-Null
          [IO.File]::WriteAllText((Resolve-Path ".").Path + "\" + $issFile, $iss)
          Copy-Item vc_redist.x64.exe build\ -Force
          Copy-Item vc_redist.arm64.exe build\ -Force

          & $iscc $issFile
          if ($LASTEXITCODE -ne 0) { throw "iscc failed: $LASTEXITCODE" }

          $exeFile = Join-Path (Split-Path $issFile -Parent) "$out"
          if (-not (Test-Path $exeFile)) {
            $found = Get-ChildItem -Recurse -Filter "$out" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $exeFile = $found.FullName }
          }
          if (-not (Test-Path $exeFile)) { throw "Universal exe file not produced" }

          New-Item -Force -ItemType Directory dist | Out-Null
          Copy-Item $exeFile dist\ -Force
          Write-Host "Universal exe copied to dist/"

      - name: List universal dist contents
        shell: pwsh
        if: always()
        run: |
          Write-Host "=== dist/ ==="
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select-Object FullName, Length }
          else { Write-Host "dist/ absent" }

      - name: Upload Windows universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-windows-universal
          path: dist/**
          if-no-files-found: error
          retention-days: 3

  ios:
    name: iOS IPA
    runs-on: macos-latest
    if: github.event_name == 'push' || inputs.build_ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build cache
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Build IPA
        env:
          XOR_KEY: ${{ secrets.XOR_KEY }}
          FASTCAT_KEY_CURRENT: ${{ secrets.FASTCAT_KEY_CURRENT }}
          FASTCAT_KEY_NEXT: ${{ secrets.FASTCAT_KEY_NEXT }}
        run: bash scripts/package_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' || inputs.build_linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Flutter arm64
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch "${FLUTTER_VERSION}" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
          cache-dependency-path: core/go.sum

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build \
            pkg-config

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build cache
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Build Linux packages
        env:
          XOR_KEY: ${{ secrets.XOR_KEY }}
          FASTCAT_KEY_CURRENT: ${{ secrets.FASTCAT_KEY_CURRENT }}
          FASTCAT_KEY_NEXT: ${{ secrets.FASTCAT_KEY_NEXT }}
        run: dart run setup.dart linux --arch ${{ matrix.arch }} --out app --env stable

      - name: List dist contents
        shell: bash
        if: always()
        run: |
          if [ -d dist ]; then
            find dist -type f -exec ls -lh {} \;
          else
            echo "dist/ directory does not exist"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-linux-${{ matrix.arch }}
          path: dist/**
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macOS Universal DMG
    runs-on: macos-15
    if: github.event_name == 'push' || inputs.build_macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"
          cache-dependency-path: core/go.sum

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean build cache
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Analyze macOS client
        run: flutter analyze --no-pub

      - name: Test macOS client
        run: flutter test --no-pub

      - name: Build macOS universal DMG
        env:
          XOR_KEY: ${{ secrets.XOR_KEY }}
          FASTCAT_KEY_CURRENT: ${{ secrets.FASTCAT_KEY_CURRENT }}
          FASTCAT_KEY_NEXT: ${{ secrets.FASTCAT_KEY_NEXT }}
        run: dart run setup.dart macos --arch universal --out app --env stable

      - name: Verify macOS bundle
        run: bash scripts/verify_macos_bundle.sh

      - name: Run macOS startup smoke test
        run: bash scripts/smoke_test_macos_app.sh

      - name: Upload macOS universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: FastCat-macos-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3
