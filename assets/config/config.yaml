# XBoard 客户端配置文件
# 填写远程配置源 URL，客户端启动时自动拉取面板域名

app_name: 快猫
app_name_en: FastCat

# 客户端统一主题色（仅支持 #RRGGBB）
# 按钮、导航、选中状态等品牌色均以此字段为准
theme_color: "#4566AE"

# 面板类型：xboard 或 v2board
# 必须与远程 config.json 中的 panel_type 一致
panel_type: v2board

# API 路径前缀（默认 /api/v1）
# XBoard/V2Board 使用 /api/v1，PPanel 使用 /v1
# 远程配置中的 api_prefix 字段可覆盖此值
api_prefix: /api/v1

# 功能开关（本地兜底值，远程 OSS 配置中 features 字段可覆盖）
features:
  traffic_details_enabled: true
  knowledge_base_enabled: true
  gift_card_enabled: true
  join_group_enabled: true
  orders_enabled: true
  devices_enabled: false
  tickets_enabled: false
  balance_enabled: true

# 节点延迟显示折扣（本地兜底，远程 latency 同名字段优先）
# 0 表示显示真实延迟；有效范围 0–90。
latency:
  display_discount_percent: 30

# 远程配置源
# 普通源并发请求，优先选择 config_version 更新的有效配置
# 普通源全部不可用时，再使用程序内置紧急 OSS 和上次完整配置缓存
# 所有源均使用相同的 XOR+Base64 密钥（构建时通过 XOR_KEY 注入）
contact_fallback:
  website: "https://fastcat2.com"
  crisp_website_id: "d5182e08-1faa-4fa9-b3c2-2a34f1975d5f"

startup_cache:
  enabled: true
  ttl_hours: 72
  probe_timeout_ms: 3000

remote_config:
  # 每个源的最大重试次数（默认 3，0 表示不重试只尝试一次）
  max_retries: 2
  sources:

    - name: "source_0"
      url: https://cat920-1457006933.cos.ap-chengdu.myqcloud.com/cat.json
    - name: "source_1"
      url: https://cat921.oss-cn-hongkong.aliyuncs.com/cat.json
    - name: "source_2"
      url: https://sdfsf.cn-bj.ufileos.com/cat.json
